name: Build and Deploy to AWS

# Every push to main: build in the cloud, rsync the build + source to the AWS server
# over SSH, then restart the systemd service (next-safestorage-transport).
#
# Secrets: AWS_HOST, AWS_USER, AWS_SSH_KEY (private key), AWS_APP_DIR (absolute app path).
# The server's .env is NEVER touched by deploys — it is the source of truth for env vars
# (server.js loads it at boot).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22 (matches the server runtime)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Set up SSH
        env:
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AWS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: Rsync app to server
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
          AWS_APP_DIR: ${{ secrets.AWS_APP_DIR }}
        run: |
          rsync -az --omit-dir-times --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no -o ConnectTimeout=20" \
            --exclude '.git*' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '.next/cache' \
            --exclude '*.map' \
            --exclude '*.nft.json' \
            --exclude 'tmp' \
            --exclude '.env' \
            --exclude '.env.*' \
            ./ "$AWS_USER@$AWS_HOST:$AWS_APP_DIR/"

      - name: Install prod deps + restart service
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
          AWS_APP_DIR: ${{ secrets.AWS_APP_DIR }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no -o ConnectTimeout=20 "$AWS_USER@$AWS_HOST" '
            set -e
            cd '"$AWS_APP_DIR"'
            # No-op in seconds when the lockfile is unchanged; installs new deps when it is.
            npm install --omit=dev --no-audit --no-fund 2>&1 | tail -2
            # Restart: systemd via passwordless sudo, else kill the node process and let
            # systemd auto-revive it with the new code.
            if sudo -n systemctl restart next-safestorage-transport.service 2>/dev/null; then
              echo "restarted via sudo systemctl"
            elif pkill -f "'"$AWS_APP_DIR"'/server.js" || pkill -f "server.js"; then
              echo "killed node process; systemd will revive it"
            else
              echo "WARNING: could not restart — grant NOPASSWD sudo for: systemctl restart next-safestorage-transport.service"
            fi
            sleep 6
            systemctl is-active next-safestorage-transport.service || true
          '
