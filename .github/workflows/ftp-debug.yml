name: Server admin (run pending migrations)

# Applies the SQL migrations that ship with the app to the live database.
# Every migration file is written to be re-runnable, and each one is applied inside its own mysql
# invocation so a failure in one is reported without stopping the rest.
on:
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Apply migrations
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
          AWS_APP_DIR: ${{ secrets.AWS_APP_DIR }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$AWS_SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh -i ~/.ssh/id -o StrictHostKeyChecking=no -o ConnectTimeout=20 "$AWS_USER@$AWS_HOST" "
            set -e
            cd '$AWS_APP_DIR'

            # Credentials come from the app's own .env — read only, never rewritten.
            DBH=\$(grep -m1 '^MYSQL_HOST=' .env | cut -d= -f2- | tr -d '\"')
            DBU=\$(grep -m1 '^MYSQL_USER=' .env | cut -d= -f2- | tr -d '\"')
            DBP=\$(grep -m1 '^MYSQL_PASSWORD=' .env | cut -d= -f2- | tr -d '\"')
            DBN=\$(grep -m1 '^MYSQL_DATABASE=' .env | cut -d= -f2- | tr -d '\"')
            echo \"database: \$DBN on \$DBH as \$DBU\"

            for f in \
              mysql/migrations/2026-08-05-escalation-followup.sql \
              mysql/migrations/2026-08-07-retrieval-severity.sql \
              mysql/migrations/2026-08-07-retrieval-call-tickets.sql ; do
              echo \"== \$f ==\"
              if mysql -h \"\$DBH\" -u \"\$DBU\" -p\"\$DBP\" \"\$DBN\" < \"\$f\" ; then
                echo \"   applied\"
              else
                echo \"   FAILED (see error above)\"
              fi
            done

            echo '== resulting columns =='
            mysql -h \"\$DBH\" -u \"\$DBU\" -p\"\$DBP\" \"\$DBN\" -e \"
              SHOW COLUMNS FROM sst_ret_tickets LIKE 'severity%';
              SHOW COLUMNS FROM sst_ret_tickets LIKE 'issue_type';
              SHOW COLUMNS FROM sst_order_escalations LIKE 'followup%';
            \"
          "
