name: Server admin (install cron jobs)

# Installs the app's scheduled jobs on the server. Idempotent: entries are tagged with a marker
# comment and rewritten each run, so this can be re-run safely without piling up duplicates.
on:
  workflow_dispatch: {}

jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: Install crontab entries
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$AWS_SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh -i ~/.ssh/id -o StrictHostKeyChecking=no -o ConnectTimeout=20 "$AWS_USER@$AWS_HOST" '
            set -e
            BASE="https://safestorage.in/safestorage-transport/api"
            echo "== server time =="; date; echo "timezone: $(date +%Z)"
            # The nightly rate-sync must land at 23:30 IST — convert if the box runs on UTC.
            if [ "$(date +%Z)" = "UTC" ]; then NIGHTLY="0 18 * * *"; else NIGHTLY="30 23 * * *"; fi
            echo "nightly schedule chosen: $NIGHTLY"

            echo "== crontab BEFORE =="; crontab -l 2>/dev/null || echo "(none)"

            # keep everything that is not ours, then append a fresh block
            tmp=$(mktemp)
            crontab -l 2>/dev/null | grep -v "safestorage-transport-jobs" > "$tmp" || true
            {
              echo "*/5 * * * * curl -s -m 240 -H \"x-vercel-cron: 1\" \"$BASE/retrieval/sync\" > /dev/null 2>&1 # safestorage-transport-jobs"
              echo "$NIGHTLY curl -s -m 280 -H \"x-vercel-cron: 1\" \"$BASE/schedule/rate-sync\" > /dev/null 2>&1 # safestorage-transport-jobs"
            } >> "$tmp"
            crontab "$tmp"; rm -f "$tmp"

            echo "== crontab AFTER =="; crontab -l
            echo "== cron service =="; systemctl is-active cron 2>/dev/null || systemctl is-active crond 2>/dev/null || echo "check cron service"
          '
