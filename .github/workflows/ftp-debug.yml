name: AWS debug (inspect server)

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect AWS box over SSH
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
          AWS_APP_DIR: ${{ secrets.AWS_APP_DIR }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$AWS_SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh -i ~/.ssh/id -o StrictHostKeyChecking=no -o ConnectTimeout=20 "$AWS_USER@$AWS_HOST" '
            echo "== .env key names (values hidden) =="; grep -oE "^[A-Za-z0-9_]+" '"$AWS_APP_DIR"'/.env 2>&1
            echo "== passwordless sudo for systemctl? =="; sudo -n systemctl status next-safestorage-transport.service --no-pager 2>&1 | head -3
            echo "== unit file =="; systemctl cat next-safestorage-transport.service --no-pager 2>&1 | head -25
            echo "== BUILD_ID =="; cat '"$AWS_APP_DIR"'/.next/BUILD_ID; echo
            echo "== service state =="; systemctl is-active next-safestorage-transport.service
          '
