name: AWS debug (inspect server)

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose why INTERAKT key is invisible
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
          AWS_APP_DIR: ${{ secrets.AWS_APP_DIR }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$AWS_SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh -i ~/.ssh/id -o StrictHostKeyChecking=no -o ConnectTimeout=20 "$AWS_USER@$AWS_HOST" '
            cd '"$AWS_APP_DIR"'
            echo "== value length + first 4 chars of INTERAKT line =="
            awk -F= "/^INTERAKT_API_KEY=/{v=substr(\$0,index(\$0,\"=\")+1); print \"len:\", length(v), \"start:\", substr(v,1,4)}" .env
            echo "== line endings (od of that line) =="; grep "^INTERAKT_API_KEY=" .env | od -c | tail -2
            echo "== any .env.local/.env.production? =="; ls -la .env* 2>&1
            echo "== systemd unit =="; systemctl cat next-safestorage-transport.service --no-pager 2>&1 | head -30
            echo "== what the RUNNING process sees =="
            PID=$(systemctl show -p MainPID --value next-safestorage-transport.service)
            sudo -n cat /proc/$PID/environ 2>/dev/null | tr "\0" "\n" | grep -oE "^[A-Za-z0-9_]+" | sort | head -30 || tr "\0" "\n" < /proc/$PID/environ 2>/dev/null | grep -oE "^[A-Za-z0-9_]+" | sort | head -30 || echo "cannot read environ"
          '
