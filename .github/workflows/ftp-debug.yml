name: FTP debug (inspect server files)

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read htaccess + passenger config
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          c() { curl -sS --connect-timeout 20 --max-time 120 --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/$1" 2>&1; }
          echo "== ROOT .htaccess (current) =="; c ".htaccess"
          echo; echo "== transport .htaccess =="; c "safestorage-transport/.htaccess"
          echo; echo "== ROOT .htaccess pre-maint backup (first 60 lines) =="; c ".htaccess.pre-maint-20260724183401" | head -60
