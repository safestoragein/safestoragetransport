name: Server admin (repair env permissions)

on:
  workflow_dispatch: {}

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Restore .env ownership so the service can read it
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
          AWS_APP_DIR: ${{ secrets.AWS_APP_DIR }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$AWS_SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh -i ~/.ssh/id -o StrictHostKeyChecking=no -o ConnectTimeout=20 "$AWS_USER@$AWS_HOST" '
            cd '"$AWS_APP_DIR"'
            echo "== before =="; ls -l .env; ls -l .env.bak.* 2>/dev/null | tail -1
            # The service runs as www-data and reads .env through the group. Replacing the file with
            # mv from /tmp had reset owner+mode, so the app booted with no MYSQL_* at all.
            sudo -n chgrp www-data .env 2>/dev/null || chgrp www-data .env 2>/dev/null || true
            chmod 660 .env
            echo "== after =="; ls -l .env
            echo "== keys =="; grep -oE "^[A-Za-z0-9_]+" .env
            sudo -n systemctl restart next-safestorage-transport.service && echo restarted
            sleep 8; systemctl is-active next-safestorage-transport.service
          '
