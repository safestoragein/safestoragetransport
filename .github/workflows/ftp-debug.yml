name: FTP debug (inspect server files)

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Compare FTP target vs live DNS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          echo "== IP of FTP_SERVER secret =="
          python3 -c "import socket,os;print(sorted({i[4][0] for i in socket.getaddrinfo(os.environ['FTP_SERVER'],21)}))"
          echo "== IP of safestorage.in (live site) =="
          python3 -c "import socket;print(sorted({i[4][0] for i in socket.getaddrinfo('safestorage.in',443)}))"
          echo "== IP of d4017.bom1.stableserver.net (new cPanel host) =="
          python3 -c "import socket;print(sorted({i[4][0] for i in socket.getaddrinfo('d4017.bom1.stableserver.net',443)}))" || true
