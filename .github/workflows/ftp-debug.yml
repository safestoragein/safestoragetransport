name: AWS debug (inspect server)

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure INTERAKT key in server .env + restart
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
          AWS_APP_DIR: ${{ secrets.AWS_APP_DIR }}
          INTERAKT_API_KEY: ${{ secrets.INTERAKT_API_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$AWS_SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh -i ~/.ssh/id -o StrictHostKeyChecking=no -o ConnectTimeout=20 "$AWS_USER@$AWS_HOST" '
            cd '"$AWS_APP_DIR"'
            echo "== .env keys BEFORE =="; grep -oE "^[A-Za-z0-9_]+" .env
            if ! grep -q "^INTERAKT_API_KEY=" .env; then
              printf "\nINTERAKT_API_KEY='"$INTERAKT_API_KEY"'\n" >> .env
              echo "-> key appended"
            else
              echo "-> key already present"
            fi
            echo "== .env keys AFTER =="; grep -oE "^[A-Za-z0-9_]+" .env
            sudo -n systemctl restart next-safestorage-transport.service && echo restarted
            sleep 6; systemctl is-active next-safestorage-transport.service
          '
